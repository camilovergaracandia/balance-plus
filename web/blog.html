<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance+ | Blog</title>
  <link rel="icon" type="image/png" href="Isotipo 2 transparente.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    .hidden { display: none !important; }

    :root {
      --navy:       #1B2D5E;
      --navy-dark:  #142248;
      --navy-mid:   #2a4080;
      --sage:       #8AB090;
      --sage-dark:  #6A9070;
      --sage-light: #c8deca;
      --sage-faint: #f0f6f1;
      --text:       #1a1f2e;
      --muted:      #5a6475;
      --border:     #dde3e8;
      --white:      #ffffff;
      --bg:         #f7f9fb;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── LAYOUT ─────────────────────────────────────────── */
    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ─── NAV ────────────────────────────────────────────── */
    nav {
      height: 68px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-divider {
      width: 1px;
      height: 26px;
      background: var(--border);
    }

    .logo-section-label {
      font-size: 19px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--sage-dark);
      color: var(--white);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .nav-cta:hover { background: var(--sage); }

    /* ─── MAIN ───────────────────────────────────────────── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 62fr 38fr;
      overflow: hidden;
    }

    /* ─── LEFT: POST DESTACADO ───────────────────────────── */
    .col-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 36px 48px;
      background: var(--white);
      overflow-y: auto;
    }

    .featured-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      background: var(--sage-faint);
      color: var(--sage-dark);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 6px 13px;
      border-radius: 20px;
      border: 1px solid var(--sage-light);
      margin-bottom: 18px;
    }

    .featured-cover {
      width: 100%;
      aspect-ratio: 36 / 7;
      border-radius: 16px;
      background: var(--navy);
      display: flex;
      align-items: flex-end;
      padding: 18px 20px;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .featured-cover .cover-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; display: block; z-index: 0;
    }

    .featured-cover::before {
      content: ''; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(135deg, rgba(27,45,94,0.80) 0%, rgba(42,64,128,0.55) 55%, rgba(106,144,112,0.55) 130%);
    }

    .featured-cover::after {
      content: '';
      position: absolute;
      top: -40px; right: -30px;
      width: 180px; height: 180px;
      background: url('Isotipo 1 blanco.png') center/contain no-repeat;
      opacity: 0.14; z-index: 1;
    }

    .featured-cover-tag {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.16);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 6px 12px;
      border-radius: 18px;
      backdrop-filter: blur(4px);
    }

    .featured-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 12px;
    }

    .featured-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }

    .views { display: inline-flex; align-items: center; gap: 4px; }
    .views svg { opacity: 0.85; }

    .top-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: #eaf0fb; color: var(--navy);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
      padding: 3px 9px; border-radius: 20px;
    }
    .top-badge svg { opacity: 0.9; }

    .featured-title {
      font-size: clamp(26px, 3vw, 36px);
      font-weight: 800;
      line-height: 1.15;
      color: var(--navy);
      letter-spacing: -0.8px;
      margin-bottom: 14px;
    }

    .featured-excerpt {
      font-size: 15px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .featured-cta {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: var(--sage-dark);
      color: var(--white);
      font-size: 15px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      width: fit-content;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 16px rgba(106,144,112,0.3);
    }

    .featured-cta:hover { background: var(--sage); transform: translateY(-1px); }

    /* ─── RIGHT: POSTS ANTERIORES POR MES ────────────────── */
    .col-right {
      display: flex;
      flex-direction: column;
      padding: 36px 44px;
      background: var(--bg);
      overflow-y: auto;
    }

    .archive-head {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--navy);
      margin-bottom: 34px;
    }

    .archive-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .month-group { margin-bottom: 22px; }

    .month-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--sage-dark);
      margin-bottom: 12px;
    }

    .month-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .post-card {
      display: flex;
      align-items: center;
      gap: 13px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      text-decoration: none;
      margin-bottom: 10px;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    .post-card:hover {
      border-color: var(--sage-light);
      box-shadow: 0 4px 14px rgba(27,45,94,0.07);
      transform: translateY(-1px);
    }

    .post-thumb {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background: var(--navy);
    }

    .post-thumb .thumb-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; display: block; z-index: 0;
    }

    .post-thumb::before {
      content: ''; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(135deg, rgba(27,45,94,0.78) 0%, rgba(42,64,128,0.45) 60%, rgba(106,144,112,0.45) 130%);
    }

    .post-card-body { flex: 1; min-width: 0; }

    .post-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .post-card-cat {
      color: var(--sage-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .post-card-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.35;
    }

    /* ─── FOOTER ─────────────────────────────────────────── */
    footer {
      height: 60px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 48px;
      background: var(--white);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .footer-social {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      transition: background 0.15s;
    }

    .footer-social:hover { background: var(--navy-mid); }

    /* ─── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 768px) {
      html, body { overflow: auto; height: auto; }

      nav { padding: 0 20px; }

      main {
        grid-template-columns: 1fr;
        overflow: auto;
        height: auto;
      }

      .col-left { padding: 32px 22px; }
      .col-right { padding: 28px 22px 40px; background: var(--white); }

      footer {
        height: auto;
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 12px;
        padding: 18px 20px;
        text-align: center;
      }

      footer a { justify-self: center !important; }
    }
  </style>
<script src="bp-cookies.js"></script>
</head>
<body>

<div class="page">

  <!-- NAV -->
  <nav>

  </nav>

  <!-- MAIN CONTENT -->
  <main>

<script src="blog-data.js"></script>
<script>
  const MES_CORTO = { 'Enero':'Ene','Febrero':'Feb','Marzo':'Mar','Abril':'Abr','Mayo':'May','Junio':'Jun','Julio':'Jul','Agosto':'Ago','Septiembre':'Sep','Octubre':'Oct','Noviembre':'Nov','Diciembre':'Dic' };

  function fechaCorta(iso, mes) {
    if (iso && /^\d{4}-\d{2}-\d{2}$/.test(iso)) {
      const [a, m, d] = iso.split('-');
      const nombres = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      return `${d} ${nombres[parseInt(m,10)]} ${a}`;
    }
    return mes || '';
  }

  function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const EYE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  function viewsHtml(n) { return `<span class="views">${EYE}${bpFmtViews(n)}</span>`; }
  const TOP_BADGE = `<span class="top-badge">${EYE} Más visto</span>`;
  function topViewedId(list) {
    let id = null, v = -1;
    list.forEach(p => { if ((p.views || 0) > v) { v = p.views || 0; id = p.id; } });
    return v > 0 ? id : null;
  }

  function renderBlog() {
    const posts = bpLoadPosts().filter(p => p.status === 'Publicado');
    const topId = topViewedId(posts);

    // Destacado: el marcado como featured; si no hay, el más reciente por fecha
    let featured = posts.find(p => p.featured);
    if (!featured) {
      featured = posts.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
    }

    const coverEl   = document.getElementById('featured-cover');
    const ctaEl     = document.getElementById('featured-cta');
    const emptyEl   = document.getElementById('featured-empty');

    if (featured) {
      bpApplyImg(document.getElementById('featured-img'), bpCoverOpts(featured));
      coverEl.classList.remove('hidden');
      ctaEl.href = 'articulo.html?id=' + featured.id;
      ctaEl.classList.remove('hidden');
      emptyEl.classList.add('hidden');
      document.getElementById('featured-tag').textContent = featured.category || 'Artículo';
      document.getElementById('featured-meta').innerHTML =
        `<span>${esc(featured.month)}</span><span class="dot"></span>` +
        `<span>${esc(featured.author)}</span><span class="dot"></span>` +
        `<span>${esc(featured.readTime)} de lectura</span><span class="dot"></span>` +
        viewsHtml(featured.views) +
        (featured.id === topId ? '<span class="dot"></span>' + TOP_BADGE : '');
      document.getElementById('featured-title').textContent = featured.title;
      document.getElementById('featured-excerpt').textContent = featured.excerpt || '';
    } else {
      coverEl.classList.add('hidden');
      ctaEl.classList.add('hidden');
      document.getElementById('featured-meta').innerHTML = '';
      document.getElementById('featured-title').textContent = '';
      document.getElementById('featured-excerpt').textContent = '';
      emptyEl.classList.remove('hidden');
    }

    // Anteriores: publicados, sin el destacado, agrupados por mes
    const previous = posts.filter(p => p !== featured);
    const list = document.getElementById('archive-list');

    if (!previous.length) {
      list.innerHTML = `<p style="color:var(--muted);font-size:13.5px">Aún no hay publicaciones anteriores.</p>`;
      return;
    }

    let html = '';
    BP_MONTH_ORDER.forEach(month => {
      const group = previous
        .filter(p => p.month === month)
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      if (!group.length) return;
      html += `<div class="month-group"><div class="month-label">${esc(month)}</div>`;
      group.forEach(p => {
        html += `
          <a href="articulo.html?id=${p.id}" class="post-card">
            <div class="post-thumb"><img class="thumb-img" alt="" src="${p.thumb}" style="${bpImgStyle(bpThumbOpts(p))}"></div>
            <div class="post-card-body">
              <div class="post-card-meta">
                <span class="post-card-cat">${esc(p.category || '')}</span>
                <span class="dot" style="width:3px;height:3px;border-radius:50%;background:var(--border)"></span>
                <span>${esc(fechaCorta(p.date, p.month))}</span>
                <span class="dot" style="width:3px;height:3px;border-radius:50%;background:var(--border)"></span>
                ${viewsHtml(p.views)}
                ${p.id === topId ? '<span class="dot" style="width:3px;height:3px;border-radius:50%;background:var(--border)"></span>' + TOP_BADGE : ''}
              </div>
              <div class="post-card-title">${esc(p.title)}</div>
            </div>
          </a>`;
      });
      html += `</div>`;
    });
    list.innerHTML = html;
  }

  renderBlog();
  // Si el admin (otra pestaña) guarda cambios, el blog se actualiza solo
  window.addEventListener('storage', e => { if (e.key === BP_STORE_KEY) renderBlog(); });
</script>

</body>
