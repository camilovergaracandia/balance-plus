<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance+ | Programa Médico</title>
<link rel="icon" type="image/png" href="Isotipo 2 transparente.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ──────────────────────────────────── */
:root {
  --primary:      #1B2D5E;
  --primary-dark: #142248;
  --primary-mid:  #2a4080;
  --accent:       #8AB090;
  --accent-dark:  #6A9070;
  --accent-faint: #f0f6f1;
  --text:         #1a1f2e;
  --muted:        #5a6475;
  --border:       #dde3e8;
  --bg:           #ffffff;
  --navy:       #1B2D5E;
  --navy-dark:  #142248;
  --sage:       #8AB090;
  --white:      #ffffff;
}

/* ── RESET ───────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  min-height:100vh;
  font-family:'Inter',-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;
  font-size:15px;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none}
a{text-decoration:none;color:inherit}
select,input{font-family:inherit}
.hidden{display:none!important}

/* ════════════════════════════════════════════
   AUTH (replica de portal.html, sin redes sociales)
════════════════════════════════════════════ */
.auth-page{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#163D2B 0%,#1E5C41 55%,#2A7A57 100%);
  padding:24px;position:relative;overflow:hidden;
}
.auth-page::before{
  content:'';position:absolute;bottom:-40px;right:-40px;
  width:260px;height:260px;
  background:url('Isotipo 1 blanco.png') center/contain no-repeat;
  opacity:0.07;pointer-events:none;
}
.auth-card{
  background:#fff;border-radius:22px;
  padding:32px 30px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
  position:relative;z-index:1;
}
@media(max-width:480px){.auth-card{padding:24px 20px;border-radius:18px}}

.auth-logo{display:block;margin:0 auto 14px;height:48px;object-fit:contain}
.auth-h{font-size:20px;font-weight:900;color:var(--navy);margin-bottom:3px;letter-spacing:-0.3px;text-align:center}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.4;text-align:center}

.input-group{margin-bottom:10px}
.input-label{font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:0.6px}
.input-field{
  width:100%;padding:11px 13px;
  border:1.5px solid var(--border);border-radius:11px;font-size:14px;
  color:var(--text);background:var(--bg);outline:none;
  transition:border-color 0.15s;box-sizing:border-box;
}
.input-field:focus{border-color:#2A7A57;box-shadow:0 0 0 3px rgba(42,122,87,0.1)}

.btn{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;transition:all 0.15s;border:none}
.btn-primary{background:linear-gradient(135deg,#1E5C41,#2A7A57);color:#fff;box-shadow:0 3px 12px rgba(30,92,65,0.3)}
.btn-primary:hover{background:linear-gradient(135deg,#163D2B,#1E5C41);box-shadow:0 4px 16px rgba(30,92,65,0.4)}

.auth-footer{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.auth-footer a{color:#1E5C41;font-weight:800;cursor:pointer}
.auth-footer a:hover{text-decoration:underline;color:#163D2B}

/* ════════════════════════════════════════════
   BARRA DESLIZANTE (segmented control)
════════════════════════════════════════════ */
.tab-bar{
  position:relative;
  display:grid;grid-template-columns:1fr 1fr 1fr;
  background:var(--accent-faint);
  border-radius:13px;
  padding:4px;
  margin-bottom:22px;
  gap:0;
}
.tab-slider{
  position:absolute;top:4px;left:4px;
  width:calc((100% - 8px) / 3);
  height:calc(100% - 8px);
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
  transition:transform 0.28s cubic-bezier(0.65,0,0.35,1);
  z-index:1;
}
.tab-btn{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 6px;
  font-size:12.5px;font-weight:700;color:var(--muted);
  border-radius:10px;
  transition:color 0.2s;
  white-space:nowrap;
}
.tab-btn.active{color:#163D2B}

.provider-form{animation:fadeIn 0.25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* Toast simple para feedback sin backend */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:#163D2B;color:#fff;font-size:13px;font-weight:600;
  padding:13px 20px;border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
  opacity:0;pointer-events:none;transition:all 0.25s;
  max-width:90vw;text-align:center;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script src="bp-cookies.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px"><img src="Logo Simple.png" alt="Balance+" class="auth-logo"><span style="background:#fde68a;color:#92400e;font-size:10px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap">En construcción</span></div>

    <!-- Barra deslizante de 3 secciones -->
    <div class="tab-bar">
      <div class="tab-slider" id="tabSlider"></div>
      <button class="tab-btn active" id="tabbtn-medicos" onclick="selectProviderTab('medicos')">Médicos</button>
      <button class="tab-btn" id="tabbtn-farmacias" onclick="selectProviderTab('farmacias')">Farmacias</button>
      <button class="tab-btn" id="tabbtn-staff" onclick="selectProviderTab('staff')">Staff</button>
    </div>

    <!-- ── Médicos ── -->
    <div class="provider-form" id="form-medicos">
      <div class="input-group">
        <label class="input-label">Correo institucional</label>
        <input class="input-field" type="email" id="medicos-email" placeholder="nombre@institucion.cl">
      </div>
      <div class="input-group">
        <label class="input-label">Contraseña</label>
        <input class="input-field" type="password" id="medicos-pass" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" style="margin-top:4px" onclick="doProviderLogin('medicos')">Iniciar sesión</button>
    </div>

    <!-- ── Farmacias ── -->
    <div class="provider-form hidden" id="form-farmacias">
      <div class="input-group">
        <label class="input-label">Correo de la farmacia</label>
        <input class="input-field" type="email" id="farmacias-email" placeholder="contacto@farmacia.cl">
      </div>
      <div class="input-group">
        <label class="input-label">Contraseña</label>
        <input class="input-field" type="password" id="farmacias-pass" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" style="margin-top:4px" onclick="doProviderLogin('farmacias')">Iniciar sesión</button>
    </div>

    <!-- ── Staff ── -->
    <div class="provider-form hidden" id="form-staff">
      <div class="input-group">
        <label class="input-label">Correo corporativo</label>
        <input class="input-field" type="email" id="staff-email" placeholder="nombre@balanceplus.cl">
      </div>
      <div class="input-group">
        <label class="input-label">Contraseña</label>
        <input class="input-field" type="password" id="staff-pass" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" style="margin-top:4px" onclick="doProviderLogin('staff')">Iniciar sesión</button>
    </div>

    <div class="auth-footer" style="margin-top:22px">
      <a onclick="forgotPassword()">¿Olvidaste tu contraseña?</a>
    </div>
    <div class="auth-footer" style="margin-top:16px">
      <a href="index.html" style="font-size:12px;color:var(--muted)">← Volver al inicio</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="bp-supabase.js?v=11"></script>
<script>
const PROVIDER_TABS = ['medicos','farmacias','staff'];
const PROVIDER_LABELS = {medicos:'Médicos', farmacias:'Farmacias', staff:'Staff'};

function selectProviderTab(tab){
  const idx = PROVIDER_TABS.indexOf(tab);
  document.getElementById('tabSlider').style.transform = `translateX(${idx * 100}%)`;
  PROVIDER_TABS.forEach(t=>{
    document.getElementById('tabbtn-'+t).classList.toggle('active', t === tab);
    document.getElementById('form-'+t).classList.toggle('hidden', t !== tab);
  });
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> el.classList.remove('show'), 3200);
}

const DESTINO = { medicos:'portal-medico.html', farmacias:'portal-farmacia.html', staff:'admin.html' };
const ROL_ESPERADO = { medicos:'medico', farmacias:'farmacia', staff:'staff' };

async function doProviderLogin(role){
  const email = (document.getElementById(role+'-email').value || '').trim();
  const pass  = document.getElementById(role+'-pass').value || '';
  if(!email || !pass){ return showToast('Ingresa tu correo y contraseña.'); }

  const btns = document.querySelectorAll('#form-'+role+' .btn');
  btns.forEach(b => { b.disabled = true; b.textContent = 'Verificando…'; });

  try{
    const sb = window.BP.sb;
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ throw new Error('Correo o contraseña incorrectos.'); }

    const { data: perfil } = await sb.from('profiles').select('role').eq('id', data.user.id).single();
    const rol = perfil && perfil.role;

    if(rol === 'paciente'){
      await sb.auth.signOut();
      throw new Error('Esta cuenta es de paciente. Ingresa desde el portal del paciente.');
    }
    if(rol !== ROL_ESPERADO[role] && rol !== 'staff'){
      await sb.auth.signOut();
      throw new Error('Tu cuenta no tiene permisos de ' + PROVIDER_LABELS[role].toLowerCase() + '.');
    }

    showToast('Bienvenido. Abriendo tu portal…');
    setTimeout(()=>{ window.location.href = DESTINO[role]; }, 600);

  }catch(e){
    showToast(e.message || 'No pudimos iniciar sesión.');
    btns.forEach(b => { b.disabled = false; b.textContent = 'Iniciar sesión'; });
  }
}

async function forgotPassword(){
  const activo = PROVIDER_TABS.find(t => !document.getElementById('form-'+t).classList.contains('hidden')) || 'medicos';
  const email = (document.getElementById(activo+'-email').value || '').trim();
  if(!email){ return showToast('Escribe tu correo y vuelve a tocar el enlace.'); }
  const { error } = await window.BP.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/proveedores.html' });
  showToast(error ? 'No pudimos enviar el correo.' : 'Te enviamos un correo para restablecer tu contraseña.');
}
</script>

</body>
</html>
